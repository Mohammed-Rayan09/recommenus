<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Groups - Recommenu</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar d-flex justify-content-between align-items-center px-3 py-2">
    <i class="bi bi-list fs-4"></i>
    
    <!-- Brand Name -->
    <div class="brand fw-bold">
      <span style="color: #FEC933;">RECOM</span><span style="color: #7D2139;">MENU</span>
    </div>
    
    <i class="bi bi-bell fs-5"></i>
  </div>

  <!-- Main Group Section -->
  <div class="group-section px-3 py-4">
    
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h5 class="fw-bold mb-0">Groups</h5>
      <button class="add-btn btn btn-sm btn-outline-secondary">
        <i class="bi bi-plus"></i>
      </button>
    </div>

    <!-- Subheading -->
    <p class="text-muted mb-3" style="font-size: 14px;">
      Make a group and the app will find places that have food that the whole group will like.
    </p>

    <!-- Group Card 1 -->
    <div class="group-card d-flex justify-content-between align-items-center p-3 border rounded mb-2">
      <div>
        <div class="fw-semibold">AppsTango Employees</div>
        <small>Created by John Doe</small>
      </div>
      <i class="bi bi-chevron-right"></i>
    </div>

    <!-- Group Card 2 -->
    <div class="group-card d-flex justify-content-between align-items-center p-3 border rounded mb-2">
      <div>
        <div class="fw-semibold">Girls Night Out</div>
        <small>Created by Jane Doe</small>
      </div>
      <i class="bi bi-chevron-right"></i>
    </div>
    
  </div>

  <!-- Footer Navigation -->
  <div class="footer-bar d-flex justify-content-around py-2 border-top">
    <i class="bi bi-house-door active fs-5"></i>
    <i class="bi bi-geo-alt fs-5"></i>
    <i class="bi bi-tag fs-5"></i>
    <i class="bi bi-people fs-5"></i>
  </div>

</body>
</html>
