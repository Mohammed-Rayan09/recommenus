<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join or Create Group</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Bar Section -->
  <div class="top-bar d-flex align-items-center justify-content-between px-3 py-2">
    <i class="bi bi-arrow-left fs-4"></i>
    <div class="brand fw-bold fs-5">
      <span style="color:#FEC933;">RECOM</span><span style="color:#7D2139;">MENU</span>
    </div>
    <i class="bi bi-bell fs-5"></i>
  </div>

  <!-- Main Form Section -->
  <div class="form-section p-4">
    <!-- Heading and Description -->
    <h5 class="text-start fw-bold mb-3">Join or Add a New Group</h5>
    <p class="text-start text-muted">
      Either join an existing group by entering the link created by your friend or create a new group.
    </p>

    <!-- Join Group Section -->
    <div class="mb-3">
      <label for="joinLink" class="form-label">Join a Group</label>
      <input type="text" class="form-control" id="joinLink" placeholder="Link to Join">
    </div>
    <div class="text-end mb-4">
      <button class="btn btn-warning px-4 rounded-pill">Join</button>
    </div>

    <!-- Divider -->
    <div class="text-center my-3"><strong>OR</strong></div>

    <!-- Create Group Section -->
    <h6 class="mb-3">Create a Group</h6>
    <div class="mb-3">
      <label for="groupName" class="form-label">Name of Group</label>
      <input type="text" class="form-control" id="groupName" placeholder="Name Your Group">
    </div>

    <!-- Group Location Inputs -->
    <label class="form-label d-block mb-2">Group Location</label>
    <div class="row">
      <div class="col-md-6 mb-3">
        <input type="text" class="form-control" id="city" placeholder="City">
      </div>
      <div class="col-md-6 mb-3">
        <select class="form-select" id="state">
          <option selected disabled>State</option>
          <option>Dhaka</option>
          <option>Chittagong</option>
          <option>Khulna</option>
        </select>
      </div>
    </div>

    <!-- Create Group Button -->
    <div class="text-end">
      <button class="btn btn-warning px-4 rounded-pill">Create</button>
    </div>
  </div>

  <!-- Footer Navigation Bar -->
  <div class="footer-bar d-flex justify-content-around align-items-center py-2 border-top">
    <i class="bi bi-house-door active fs-5"></i>
    <i class="bi bi-geo-alt fs-4"></i>
    <i class="bi bi-tag fs-5"></i>
    <i class="bi bi-people fs-5"></i>
  </
